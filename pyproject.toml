[build-system]
requires = ["setuptools>=64","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowlight-image-enhance"
version = "0.0.1"
description = "Low-light image enhancement with brightness gain and saturation compensation, plus classic algorithm baselines"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "林明梓", email = "Mingzi.Grove@qq.com"}
]
keywords = ["image-processing", "low-light enhancement", "computer-vision"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy >= 1.24",
    "opencv-python >= 4.8",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "jupyter >= 1.0",
    "scikit-image >= 0.21"
]

[project.scripts]
lowlight-enhance = "lowlight_image_enhance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]